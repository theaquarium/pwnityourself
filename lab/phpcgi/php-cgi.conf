# Route .php requests through the php-cgi binary as a CGI program.
# This is the historically-standard "php-cgi behind Apache" deployment that
# CVE-2012-1823 targets: the web server hands the request's query string to
# php-cgi, and php-cgi (mis)interprets a query string with no "=" as its own
# command-line arguments.
ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
<Directory "/usr/lib/cgi-bin">
    AllowOverride None
    Options +ExecCGI
    Require all granted
</Directory>
AddHandler php-cgi .php
Action php-cgi /cgi-bin/php-cgi
<Directory /var/www/html>
    Options +ExecCGI
    Require all granted
</Directory>
